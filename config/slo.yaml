service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: Baseline local có latency P95 khoảng 1198 ms và không có request lỗi, nên ngưỡng 3000 ms giữ đủ khoảng đệm cho dao động nhưng vẫn phát hiện suy giảm rõ ràng. Với 10,000 request trong 28 ngày, SLO 99.5% cho phép tối đa 50 request lỗi hoặc chậm hơn 3000 ms.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
